default:
  image_caption: 'Photobooth'
  image_fontsize: 11
  font: 'Helvetica' # see https://github.com/digitaltom/photobooth/blob/master/INSTALL-RASPBIAN.md#font-installation

  # 'gphoto2' for a real camera, 'fake' copies the sample images in lib/fake_camera
  camera: 'gphoto2'

  # libgpiod chip for the status LEDs (Pi 5 with older kernels: gpiochip4)
  gpio_chip: 'gpiochip0'

  # base url in the QR codes, the Pi hotspot address (mDNS is unreliable on Android)
  public_url: 'http://10.42.0.1'

  # folder for the picture sets, default: storage/sets. PHOTOBOX_STORAGE env overrides it.
  storage_path:

development:
  camera: 'fake'

test:
  camera: 'fake'
