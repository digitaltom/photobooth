default:
  image_caption: 'Photobooth'
  image_fontsize: 13
  # a .ttf path (relative to the app folder) or an ImageMagick font name (`magick -list font`)
  # Rock Salt: Apache License 2.0, see fonts/LICENSE.txt
  font: 'fonts/RockSalt-Regular.ttf'

  # 'gphoto2' for a real camera, 'fake' copies the sample images in lib/fake_camera
  camera: 'gphoto2'
  # gphoto2 imageformat, a label or index from `gphoto2 --get-config imageformat`. Empty: keep the setting of the camera.
  # Use JPEG only, no RAW. Canon EOS labels, 'c' = normal instead of fine compression (sizes for a 24 MP sensor):
  #   'L'  / 'cL'  large,  6000x4000
  #   'M'  / 'cM'  medium, 3984x2656
  #   'S1' / 'cS1' small,  2976x1984
  #   'S2'         small,  2400x1600
  camera_imageformat: 'cS2'
  # minimum seconds from the start of a shot to the start of the next shot (gphoto2 -I), fake camera: seconds per photo
  camera_delay: 3

  # per ImageMagick process, 4 run in parallel (Pi 3 B: 1 GB RAM)
  imagemagick_memory_limit: '64MiB'
  imagemagick_map_limit: '128MiB'

  # libgpiod chip for the status LEDs (Pi 3 B: gpiochip0, Pi 5 with older kernels: gpiochip4)
  gpio_chip: 'gpiochip0'

  # folder for the picture sets, default: storage/sets. PHOTOBOX_STORAGE env overrides it.
  storage_path:

  # Photobox settings on the boot partition (WLAN, admin password). PHOTOBOX_CONF env overrides it.
  # Its keys override the keys in this file.
  photobox_conf: '/boot/firmware/photobox.yml'

  # password for /admin. An admin_password in photobox.yml overrides it, the admin menu writes a new one there.
  admin_password: 'photobox'

development:
  camera: 'fake'
  photobox_conf: 'tmp/photobox.yml'

test:
  camera: 'fake'
  photobox_conf: 'tmp/photobox-test.yml'
  camera_delay: 0
