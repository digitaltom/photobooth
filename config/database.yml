# SQLite only holds volatile data (job queue, cable messages), no app records.
# In production PHOTOBOX_DB_DIR points to /run/photobox (RAM), see deploy/photobox.service.
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("PHOTOBOX_DB_DIR", "storage") %>/production.sqlite3
  queue:
    <<: *default
    database: <%= ENV.fetch("PHOTOBOX_DB_DIR", "storage") %>/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("PHOTOBOX_DB_DIR", "storage") %>/production_cable.sqlite3
    migrations_paths: db/cable_migrate
