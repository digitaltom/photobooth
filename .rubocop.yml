plugins: rubocop-rails

Rails:
  Enabled: true

# PictureSet is not ActiveRecord, it has no find_each
Rails/FindEach:
  Enabled: false

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  DisplayCopNames: true
  DisplayStyleGuide: true
  ExtraDetails: true
  Exclude:
    - bin/**/*
    - vendor/**/*
    - tmp/**/*
    - db/*_schema.rb

Layout/LineLength:
  Max: 140

Layout/EmptyLinesAroundClassBody:
  Enabled: false

Layout/EmptyLinesAroundBlockBody:
  Enabled: false

Metrics/MethodLength:
  Max: 20

Metrics/ClassLength:
  Max: 120

Metrics/BlockLength:
  Max: 40
  Exclude:
    - spec/**/*

# English UI, no locale files
Rails/I18nLocaleTexts:
  Enabled: false

Metrics/AbcSize:
  Max: 26

Style/RegexpLiteral:
  Enabled: false

Style/NegatedWhile:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/BlockComments:
  Enabled: false

Layout/MultilineOperationIndentation:
  EnforcedStyle: indented
